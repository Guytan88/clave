function esc(s){ return s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function block(d, upd){
  return "<h2>"+esc(d.h)+"</h2><p class='upd'>"+esc(upd)+"</p>" +
    d.s.map(([h,p])=>"<h3>"+esc(h)+"</h3><p>"+esc(p)+"</p>").join("");
}

  document.getElementById("toc-t").textContent = d.terms.h;
  document.getElementById("toc-p").textContent = d.privacy.h;
  document.getElementById("back").textContent = d.back;
  document.getElementById("terms").innerHTML = block(d.terms, d.upd);
  document.getElementById("privacy").innerHTML = block(d.privacy, d.upd);
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang === l));
  try { localStorage.setItem("clave-lang", l); } catch(e){}
}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));
let saved = new URLSearchParams(location.search).get("lang");
if(!L[saved]){ try { saved = localStorage.getItem("clave-lang"); } catch(e){} }
setLang(L[saved] ? saved : "es");
if(location.hash){ const t=document.querySelector(location.hash); if(t) t.scrollIntoView(); }
